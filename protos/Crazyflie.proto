PROTO Crazyflie [
  field SFInt32    id     0
  field SFVec3f    translation     0 0 0.015   
  field SFRotation rotation        0 0 1 0     
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    controller "<extern>"
    supervisor TRUE
    synchronization FALSE
    name %<= '"' + 'cf' + fields.id.value + '"' >%
    model "Bitcraze's Crazyflie"
    children [
      PointLight {
         attenuation 0 0 1  
         location    0 0 0.1 
         radius      100     
      }
      DEF BODY Transform {
        translation 0 0 -0.015
        children [
          CadShape {
            url [
                "../meshes/collada_files/cf2_assembly.dae"
            ]
          }
        ]
      }
      DEF ZRANGER Transform {
        translation 0 0 0.02
        children [
          DistanceSensor {
            rotation 0 1 0 1.57
            name "zrange"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
        ]
      }
      DEF MULTIRANGER Transform {
        translation 0 0 0.02
        children [
          DistanceSensor {
            rotation 0 0 1 -1.57
            name "range_right"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
          DistanceSensor {
            rotation 0 0 1 3.14
            name "range_back"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
          DistanceSensor {
            rotation 0 0 1 1.57
            name "range_left"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
          DistanceSensor {
            name "range_front"
            lookupTable [
              0 0 0
              2 2000 0
            ]
          }
        ]
      }
      GPS {
      }
      Gyro {
      }
      InertialUnit {
        name "inertial_unit"
      }
      Compass {
      }
      DEF M1 Propeller {
        shaftAxis 0 0 1
        centerOfThrust 0.031 -0.031 0.008
        thrustConstants -4e-05 0
        torqueConstants 2.4e-06 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "m1_motor"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation 0.031 -0.031 0.008
          children [
            DEF FASTHELIX Shape {
              appearance PBRAppearance {
                baseColor 0.1 0.1 0.1
                baseColorMap ImageTexture {
                  url [
                    "../meshes/textures/fast_helix.png"
                  ]
                }
                metalness 0
              }
              geometry Cylinder {
                height 0.001
                radius 0.025
              }
            }
          ]
        }
        slowHelix Solid {
          translation 0.031 -0.031 0.008
          children [
            DEF PROP_SHAPE Shape {
              appearance DEF PLASTIC PBRAppearance {
                baseColor 0 0 0
                metalness 0.3
              }
              geometry Mesh {
                url [
                    "../meshes/collada_files/ccw_prop.dae"
                ]
              }
            }
          ]
        }
      }
      DEF M2 Propeller {
        shaftAxis 0 0 1
        centerOfThrust -0.031 -0.031 0.008
        thrustConstants 4e-05 0
        torqueConstants 2.4e-06 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "m2_motor"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation -0.031 -0.031 0.008
          children [
            USE FASTHELIX
          ]
        }
        slowHelix Solid {
          translation -0.031 -0.031 0.008
          children [
            USE PROP_SHAPE
          ]
        }
      }
      DEF M3 Propeller {
        shaftAxis 0 0 1
        centerOfThrust -0.031 0.031 0.008
        thrustConstants -4e-05 0
        torqueConstants 2.4e-06 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "m3_motor"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation -0.031 0.031 0.008
          children [
            USE FASTHELIX
          ]
        }
        slowHelix Solid {
          translation -0.031 0.031 0.008
          children [
            USE PROP_SHAPE
          ]
        }
      }
      DEF M4 Propeller {
        shaftAxis 0 0 1
        centerOfThrust 0.031 0.031 0.008
        thrustConstants 4e-05 0
        torqueConstants 2.4e-06 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "m4_motor"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation 0.031 0.031 0.008
          children [
            USE FASTHELIX
          ]
        }
        slowHelix DEF PROP Solid {
          translation 0.031 0.031 0.007
          children [
            USE PROP_SHAPE
          ]
        }
      }
    ]
    boundingObject Cylinder {
      height 0.03
      radius 0.05
    }
    physics Physics {
      density -1
      mass 0.05 
    }
  }
}
